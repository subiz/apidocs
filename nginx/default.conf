server {
  listen 80;
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

  location = /developers {
    try_files /developers/index.html =404;
  }

  location /developers/_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location /developers/ {
    # Serve extensionless articles directly; keep Markdown and Pagefind files.
    # No SPA fallback: an unknown article must return 404.
    try_files $uri/index.html $uri =404;
  }

  location ~ ^/developers/.*\.md$ {
    default_type text/markdown;
    try_files $uri =404;
  }

  location / { return 404; }
}
